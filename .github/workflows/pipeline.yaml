name: Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Tests
        run: |
          set -ex
          make test-race

      - name: Check for Modified Files
        run: |
          set -ex
          git diff --exit-code

  test-backends:
    name: Run Backend Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Tests
        run: |
          set -ex
          make test-backends

      - name: Check for Modified Files
        run: |
          set -ex
          git diff --exit-code

  test-examples:
    name: Run Example Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Tests
        run: |
          set -ex
          make test-examples

      - name: Check for Modified Files
        run: |
          set -ex
          git diff --exit-code

  test-ide-intellij:
    name: Run IntelliJ IDE Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Plugin Verifier data
        uses: actions/cache@v4
        with:
          path: ~/.pluginVerifier
          key: plugin-verifier-${{ runner.os }}-${{ hashFiles('ide/intellij/gradle.properties', 'ide/intellij/build.gradle.kts', 'ide/intellij/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            plugin-verifier-${{ runner.os }}-

      - name: Run Tests
        run: |
          set -ex
          make -C ide/intellij test
          make -C ide/intellij package

      - name: Check for Modified Files
        run: |
          set -ex
          git diff --exit-code

  test-ide-vscode:
    name: Run vscode IDE Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          set -ex
          xvfb-run -a make -C ide/vscode test
          make -C ide/vscode package

      - name: Check for Modified Files
        run: |
          set -ex
          git diff --exit-code
