# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: golr

builds:
  - main: ./cmd/golr
    env:
      - CGO_ENABLED=0
    # Debug assertions are enabled by default and cost ~9-17% of parser
    # generation runtime. Shipped binaries build without them.
    tags:
      - no_debug_assert
    # Reproducible builds: keep local file system paths out of the binary.
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - arm64
      - amd64

archives:
  - formats: ["binary"]
