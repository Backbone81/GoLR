unreleased:
- description: Conflicts decided by precedence and associativity declarations are
    no longer reported. The conflict summary and --verbose listing of golr parser,
    and the conflicts returned by the GrammarToParser functions of the GoLR cores,
    now only cover conflicts resolved by shift over reduce or by the earliest production,
    plus unresolved ones.
- description: Fixed the Bison frontend reading a string literal which was not declared
    as a token alias, like "+", as a nonterminal without productions instead of as
    a terminal.
- description: Adjusted conflict reporting to be stable. This allows conflict reports
    to be diffed reliably, even with the grammar being modified.
- description: Unresolved conflicts are now reported in full.
- description: Added --with-state-number to golr parser, which adds the state number
    to every state of the conflict report.
- description: 'BREAKING: Parse tree nodes carry the byte offset and length of the
    source they cover instead of a lexeme. Scanners resolve these through the new
    Position and Text methods, which replace Line and Column.'
- description: 'BREAKING: Custom token sources have to provide Position and Text.
    A token they insert needs an empty lexeme at the offset where it is inserted.'
- description: 'BREAKING: C scanners allocate a line table on the first position lookup.
    Call <prefix>_scanner_free once a scanner is done with, or the table leaks.'
- description: 'BREAKING: The Rust ParseNode no longer has a lifetime parameter, and
    the Rust Scanner is no longer Sync.'
- description: Semantic errors in GoLR and GNU Bison grammar files, like undeclared
    terminals or duplicate declarations, now report the file, line and column they
    occur at.
- description: 'BREAKING: The column reported by the Position method of generated
    scanners now counts UTF-8 characters instead of bytes, and a tab counts as one
    column. Use the byte offset to get at the bytes of the source.'
- description: Added --fail-on-sr-conflicts, --fail-on-rr-conflicts and --fail-on-conflicts
    to golr parser, which make the run fail on a shift/reduce or reduce/reduce conflict
    that precedence and associativity do not resolve.
- description: The conflict summary of golr parser now counts resolved and unresolved
    conflicts separately, and a conflict decided by shift over reduce no longer also
    counts as a reduce/reduce conflict.
releases:
- version: |
    v0.4.0
  date: 2026-09-13T02:00:00+02:00
  entries:
  - description: Fixed the scanner walking its line and column counters past the end
      of the source when Reset was given an offset beyond it. The offset is now clamped,
      as it already was in the C and C++ backends.
  - description: 'BREAKING: Aligned the generated scanners and parsers across all
      language backends.'
  - description: Added a Kotlin backend for the scanner and parser generator, selected
      with --backend kotlin and configured with --backend-kotlin-package-name.
  - description: Improved error recovery for malformed GoLR grammar files.
  - description: The GoLR grammar frontend now rejects regex and string literals which
      span multiple lines, so a missing closing delimiter no longer consumes the rest
      of the file.
  - description: Added the @name annotation to the GoLR grammar frontend, letting
      a production alternative be given an explicit name instead of the auto-generated
      <rule>_<n>.
  - description: Generated parsers now expose every production as a named Production
      constant and set it on the ParseNode/Node each reduction produces, so a tree
      walk can switch on production identity instead of counting children.
  - description: Generated parsers can emit a text trace of every action they take
      - each shift, reduce, accept and error recovery step - through an optional trace
      hook set on the parser instance, as a debugging aid for understanding an unexpected
      parse.
  - description: Fixed golr fmt discarding all comments from GoLR grammar files. It
      now preserves comments and blank lines, and no longer fails on a grammar file
      with broken syntax.
- version: |
    v0.3.0
  date: 2026-08-23T02:00:00+02:00
  entries:
  - description: Added a JavaScript scanner backend.
  - description: Added a JavaScript parser generator backend, selected with --backend
      javascript. The generated ECMAScript module imports the token constants from
      the generated scanner, whose module specifier can be set with --backend-javascript-scanner-module.
  - description: Added a TypeScript scanner generator backend.
  - description: Added a TypeScript parser generator backend.
  - description: Added a C# scanner generator backend.
  - description: Added a C# parser generator backend.
  - description: Replaced the Java scanner backend with a table driven one.
  - description: Added a Java parser generator backend, selected with --backend java.
  - description: Replaced the Rust scanner backend with a table driven one.
  - description: Added a Rust parser generator backend, selected with --backend rust.
  - description: Added a Python scanner generator backend, selected with --backend
      python.
  - description: Added a Python parser generator backend, selected with --backend
      python.
  - description: Added a C++ scanner generator backend, selected with --backend cpp.
  - description: Added a C++ parser generator backend, selected with --backend cpp.
  - description: Fixed the generated scanners consuming one byte too many when a match
      failed after the automaton had already consumed bytes. The byte which ended
      the failed match now starts the next token instead of being swallowed by the
      invalid token, which had corrupted the token following the error.
  - description: Fixed the generated parser rejecting an empty input which the grammar
      accepts. The end of input is now a token the parse table decides on like any
      other.
  - description: Fixed Symbol.String of the generated Go parser printing the index
      of a symbol instead of its name.
  - description: 'BREAKING: The generated Go parser now spells the augmented start
      symbol AcceptNonterminal instead of Nonterminal_accept, which is the name every
      other language backend already uses.'
  - description: 'BREAKING: --backend go now writes the table driven scanner and parser,
      which is smaller and faster than the directly coded one it replaces. The directly
      coded Go backend is gone, and with it the names go-direct and go-table.'
  - description: 'BREAKING: The public packages pkg/parsergen/backend/golangtable
      and pkg/scannergen/backend/golangtable are now pkg/parsergen/backend/golang
      and pkg/scannergen/backend/golang, taking the place of the re-exports of the
      directly coded backend.'
  - description: Added a C scanner generator backend, selected with --backend c.
  - description: Added a C parser generator backend, selected with --backend c.
- version: |
    v0.2.0
  date: 2026-08-08T02:00:00+02:00
  entries:
  - description: The IELR(1) parser core is now a native Go implementation and is
      used by default. GNU Bison is no longer required to generate a parser. The Bison
      backed core is still available as "ielr1-bison".
  - description: The LALR(1) and LR(1) parser cores are now native Go implementations
      as well and are used by default. The Bison backed cores are still available
      as "lalr1-bison" and "lr1-bison".
  - description: Generated parsers now recover from syntax errors. Mark the places
      to resume at with the error symbol (`@error` in GoLR grammars, `error` in GNU
      Bison grammars) and the parser reports several errors in one run instead of
      stopping at the first one.
  - description: The VS Code and IntelliJ plugins now support the `@error` token.
  - description: The `parser` command now reports shift/reduce and reduce/reduce conflicts
      on stderr. The new `--verbose` flag additionally lists every conflict which
      was resolved automatically.
  - description: Generated parser tables are smaller, because reductions are compacted
      into a default reduction and unreachable states are removed.
  - description: The LALR(1) and IELR(1) cores now report an error when a grammar
      needs more states than the parser tables can address. Previously only the LR(1)
      core did.
  - description: Parser generation for large grammars is significantly faster and
      needs less memory.
  - description: The released binaries are built without debug assertions, which makes
      parser generation noticeably faster.
  - description: The parsers and scanners generated by GoLR are exempt from the Apache
      License, Version 2.0. You can license the generated files as you choose.
  - description: Fixed `%nonassoc` not rejecting sentences which it should reject.
  - description: Fixed the Go backend generating broken accept actions, which could
      result in generated code which does not compile.
  - description: Fixed terminals declared with `%precedence` being dropped when handing
      the grammar to the Bison backed cores, which silently changed how conflicts
      were resolved.
  - description: Fixed the precedence of a production getting lost while the grammar
      is augmented.
  - description: 'BREAKING: `GrammarToParser` of the `pkg/parsergen/core/...` packages
      now returns the list of conflicts as an additional result. Call sites need to
      be updated.'
  - description: Added the `golr selftest` command, which checks the IELR(1) parser
      core against a canonical LR(1) oracle on randomly generated grammars across
      all CPU cores for as long as you let it run.
  - description: Fixed index out of range panics in the Bison frontend scanner when
      a grammar file ends inside a tag, prologue or braced code block.
  - description: Fixed the Bison frontend not recognizing the %lex-param and %parse-param
      directives.
  - description: Fixed the Bison frontend scanner swallowing input after char literals
      or strings ending in an escaped backslash, like '\\'.
  - description: 'Fixed the Bison frontend ignoring char literal token declarations
      like %token ''\\'' and misnaming escaped char literals: escape sequences are
      now decoded, so different spellings of the same character resolve to the same
      terminal.'
  - description: Added the scanner backend go-table, which writes the scanner as lookup
      tables instead of as code.
  - description: Added the new parser backend 'go-table' which writes the parser as
      lookup tables instead of as control flow. The existing Go backend is now also
      available as 'go-direct', with 'go' remaining an alias for it.
- version: |
    v0.1.0
  date: 2026-07-11T02:00:00+02:00
  entries:
  - description: |
      Initial release.
